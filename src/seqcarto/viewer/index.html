<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence Cartography</title>
<style>
  :root {
    --bg: #0f1012; --panel: #17191c; --panel-2: #1f2226; --line: #2c3036;
    --text: #e6e6e3; --muted: #8b9098; --accent: #e8b04a; --accent-2: #4aa8e8;
    --om-height: 220px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  aside h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    margin: 0; padding: 16px 16px 12px; }
  .vid { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit;
    padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent; font: inherit; }
  .vid:hover { background: var(--panel-2); }
  .vid.active { background: var(--panel-2); border-left-color: var(--accent); }
  .vid .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vid .m { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  .top { padding: 14px 20px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 18px; }
  .head .m { color: var(--muted); font-variant-numeric: tabular-nums; }
  .head a { color: var(--accent-2); }
  .player-row { display: flex; gap: 16px; margin-top: 12px; align-items: flex-start; }
  video { width: 420px; max-width: 45%; aspect-ratio: 16/9; background: #000; border-radius: 4px; }
  .info { flex: 1; min-width: 0; }
  .now { font-size: 22px; font-variant-numeric: tabular-nums; }
  .now small { color: var(--muted); font-size: 14px; margin-left: 8px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .note { color: var(--muted); font-style: italic; }
  .controls { margin-top: 10px; display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 13px; }
  .controls input[type=range] { width: 140px; }
  .timeline { position: relative; height: 56px; margin-top: 14px; background: #000; cursor: crosshair;
    border-radius: 3px; overflow: hidden; }
  .timeline img { position: absolute; top: 0; height: 100%; display: block; }
  .timeline .cut { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.55); pointer-events: none; }
  .timeline .cur { position: absolute; top: 0; bottom: 0; background: rgba(232,176,74,.18);
    border-left: 1px solid var(--accent); border-right: 1px solid var(--accent); pointer-events: none; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; }
  .tip { position: fixed; pointer-events: none; background: #000d; color: #fff; padding: 3px 7px; border-radius: 3px;
    font-size: 12px; font-variant-numeric: tabular-nums; display: none; z-index: 10; white-space: nowrap; }
  .scenes { flex: 1; overflow-y: auto; padding: 8px 20px 40px; }
  .scene { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .scene .sh { display: flex; gap: 14px; align-items: baseline; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .scene .n { font-weight: 700; color: var(--muted); min-width: 3.5em; }
  .scene .d { color: var(--muted); }
  .scene.active .n { color: var(--accent); }
  .om { position: relative; overflow-x: auto; overflow-y: hidden; }
  .om-inner { position: relative; display: inline-block; cursor: pointer; }
  .om img { height: var(--om-height); display: block; border-radius: 2px; }
  .scene.active .om img { outline: 2px solid var(--accent); outline-offset: 1px; }
  .om .playhead { display: none; }
  .scene.active .om .playhead { display: block; }
  .empty { padding: 40px; color: var(--muted); }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 3px; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
    main { height: auto; }
    .player-row { flex-direction: column; }
    video { width: 100%; max-width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Sequence Cartography</h1>
    <div id="list"></div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<div class="tip" id="tip"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) e.append(k instanceof Node ? k : document.createTextNode(k));
  return e;
};
const tc = (sec) => {
  if (sec == null || !isFinite(sec)) return "–";
  const ms = Math.round(sec * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60,
        s = Math.floor(ms / 1000) % 60, f = ms % 1000;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(f).padStart(3, "0")}`;
};
const dur = (sec) => sec == null ? "" : sec >= 60 ? `${Math.floor(sec / 60)} min ${Math.round(sec % 60)} s` : `${sec.toFixed(1)} s`;

let videos = [], state = null;
const tip = $("#tip");

async function init() {
  videos = await (await fetch("/api/videos")).json();
  const list = $("#list");
  if (!videos.length) {
    $("#main").innerHTML = "";
    $("#main").append(el("div", { class: "empty" },
      "No results yet. Run ", el("code", {}, "seqcarto analyze <video>"), " first."));
    return;
  }
  for (const v of videos) {
    list.append(el("button", { class: "vid", "data-slug": v.slug, onclick: () => { location.hash = v.slug; } },
      el("div", { class: "t", title: v.title }, v.title),
      el("div", { class: "m" }, `${v.scenes} scenes · ${dur(v.duration_seconds)}`)));
  }
  window.addEventListener("hashchange", route);
  route();
}

function route() {
  const slug = decodeURIComponent(location.hash.slice(1)) || videos[0].slug;
  const v = videos.find(x => x.slug === slug) || videos[0];
  document.querySelectorAll(".vid").forEach(b => b.classList.toggle("active", b.dataset.slug === v.slug));
  open(v);
}

async function open(v) {
  const m = await (await fetch(`/data/${encodeURIComponent(v.slug)}/manifest.json`)).json();
  const fps = m.source.fps, frames = m.source.frames, base = `/data/${encodeURIComponent(v.slug)}/`;
  state = { v, m, fps, frames, base, current: -1, follow: true };
  const main = $("#main");
  main.innerHTML = "";

  const video = v.video ? el("video", { src: v.video, controls: "", preload: "metadata" }) : null;
  const nowEl = el("div", { class: "now" }, "00:00:00.000");
  const timeline = el("div", { class: "timeline" });
  const follow = el("input", { type: "checkbox", checked: "" });
  follow.addEventListener("change", () => state.follow = follow.checked);
  const zoom = el("input", { type: "range", min: "80", max: "618", value: "220" });
  zoom.addEventListener("input", () => document.documentElement.style.setProperty("--om-height", zoom.value + "px"));

  main.append(el("div", { class: "top" },
    el("div", { class: "head" },
      el("h2", {}, m.source.title),
      el("span", { class: "m" }, `${m.scenes.length} scenes · ${dur(frames / fps)} · ${m.source.width}×${m.source.height} · ${+fps.toFixed(3)} fps`),
      m.source.url ? el("a", { href: m.source.url, target: "_blank", rel: "noopener" }, "source") : ""),
    el("div", { class: "player-row" },
      video || el("div", { class: "note" }, v.video_note || `${m.source.file} cannot be played in the browser`),
      el("div", { class: "info" }, nowEl,
        el("div", { class: "hint" }, "Click the timeline or an OM image to jump there. Keys: ↑/↓ previous/next scene, space play/pause."),
        el("div", { class: "controls" },
          el("label", {}, follow, " follow playback"),
          el("label", {}, "image height ", zoom)))),
    timeline));

  // overview stripe
  const per = m.stripes.frames_per_tile;
  m.stripes.tiles.forEach((t, i) => {
    const n = Math.min(per, frames - i * per);
    timeline.append(el("img", { src: base + t, alt: "", style: `left:${i * per / frames * 100}%;width:${n / frames * 100}%` }));
  });
  for (const s of m.scenes.slice(1)) timeline.append(el("div", { class: "cut", style: `left:${s.start_frame / frames * 100}%` }));
  const curBox = el("div", { class: "cur" });
  const head = el("div", { class: "playhead", style: "left:0" });
  timeline.append(curBox, head);
  const frameAt = (e, box) => { const r = box.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  timeline.addEventListener("mousemove", e => {
    const f = frameAt(e, timeline) * frames, s = sceneAt(f);
    showTip(e, `${tc(f / fps)} · scene ${s + 1}`);
  });
  timeline.addEventListener("mouseleave", hideTip);
  timeline.addEventListener("click", e => seek(frameAt(e, timeline) * frames, true));

  // scene list
  const list = el("div", { class: "scenes" });
  state.cards = m.scenes.map((s, i) => {
    const img = el("img", { src: base + s.omimage, alt: `Scene ${i + 1}`, loading: "lazy" });
    const ph = el("div", { class: "playhead", style: "left:0" });
    const inner = el("div", { class: "om-inner" }, img, ph);
    const span = s.end_frame - s.start_frame;
    inner.addEventListener("mousemove", e => showTip(e, tc((s.start_frame + frameAt(e, inner) * span) / fps)));
    inner.addEventListener("mouseleave", hideTip);
    inner.addEventListener("click", e => seek(s.start_frame + frameAt(e, inner) * span, false));
    const card = el("section", { class: "scene", id: `s${i}` },
      el("div", { class: "sh" },
        el("span", { class: "n" }, `#${i + 1}`),
        el("span", {}, `${s.start_time} – ${s.end_time}`),
        el("span", { class: "d" }, dur(s.duration_seconds))),
      el("div", { class: "om" }, inner));
    list.append(card);
    return { card, ph };
  });
  main.append(list);

  state.video = video; state.nowEl = nowEl; state.head = head; state.curBox = curBox;
  if (video) {
    const tick = () => update(video.currentTime * fps, false);
    video.addEventListener("timeupdate", tick);
    video.addEventListener("seeked", tick);
    // smoother playhead while playing
    const loop = () => { if (state && state.video === video && !video.paused) { tick(); requestAnimationFrame(loop); } };
    video.addEventListener("play", () => requestAnimationFrame(loop));
  }
  update(0, false);
}

function sceneAt(frame) {
  const sc = state.m.scenes;
  let lo = 0, hi = sc.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (sc[mid].start_frame <= frame) lo = mid; else hi = mid - 1; }
  return lo;
}

function seek(frame, fromTimeline) {
  if (state.video) {
    state.video.currentTime = (frame + 0.5) / state.fps;
    if (!fromTimeline) state.video.play().catch(() => {});
  }
  update(frame, true);
}

function update(frame, jump) {
  const { m, frames, fps } = state;
  const i = sceneAt(frame), s = m.scenes[i];
  state.nowEl.innerHTML = "";
  state.nowEl.append(tc(frame / fps), el("small", {}, `scene ${i + 1} / ${m.scenes.length}`));
  state.head.style.left = `${frame / frames * 100}%`;
  state.curBox.style.left = `${s.start_frame / frames * 100}%`;
  state.curBox.style.width = `${(s.end_frame - s.start_frame) / frames * 100}%`;
  const card = state.cards[i];
  card.ph.style.left = `${Math.max(0, Math.min(1, (frame - s.start_frame) / (s.end_frame - s.start_frame))) * 100}%`;
  if (i !== state.current) {
    if (state.current >= 0) state.cards[state.current].card.classList.remove("active");
    card.card.classList.add("active");
    state.current = i;
    if (jump || state.follow) card.card.scrollIntoView({ block: "nearest", behavior: jump ? "smooth" : "auto" });
  }
}

function showTip(e, text) { tip.textContent = text; tip.style.display = "block"; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 14 + "px"; }
function hideTip() { tip.style.display = "none"; }

document.addEventListener("keydown", e => {
  if (!state || e.target.matches("input")) return;
  const sc = state.m.scenes;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const i = Math.max(0, Math.min(sc.length - 1, state.current + (e.key === "ArrowDown" ? 1 : -1)));
    seek(sc[i].start_frame, true);
  } else if (e.key === " " && state.video) {
    e.preventDefault();
    state.video.paused ? state.video.play() : state.video.pause();
  }
});

init().catch(err => { $("#main").textContent = "Error: " + err; });
</script>
</body>
</html>
